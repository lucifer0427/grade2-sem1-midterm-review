<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>國小二年級期中考：3D 實況滿貫王 3.0 傳奇魔王篇</title>
  <link rel="stylesheet" href="./css/style.css">

  <script type="importmap">
  {
    "imports": {
      "three": "https://esm.sh/three@0.170.0",
      "canvas-confetti": "https://esm.sh/canvas-confetti@1.9.4"
    }
  }
  </script>
</head>
<body>
  <!-- 3D 棒球場渲染畫布 -->
  <div id="canvas-container"></div>

  <!-- 實況野球級：巨型大字橫幅 + Statcast 飛行距離測速儀 -->
  <div id="big-banner" class="banner-hidden">
    <div id="banner-main">💥 HOME RUN!</div>
    <div id="banner-statcast">📏 飛行距離：145 公尺 | 初速：172 km/h</div>
  </div>

  <!-- 頂部電視轉播計分板與題目看板 -->
  <div id="jumbotron-hud">
    <div class="scoreboard-top">
      <!-- 左側：局數、魔王投手資訊與球種 -->
      <div class="tv-left-group">
        <div class="inning-badge" id="hud-inning">1局上</div>
        <div class="boss-badge" id="hud-boss">🐻 森林暴熊隊長</div>
        <div class="pitch-badge" id="hud-pitch-type">🔥 148km 火球</div>
      </div>

      <!-- 中央：得分、金幣、連擊、出局燈號與鑽石壘包圖 -->
      <div class="tv-center-group">
        <div class="score-pill">得分 <b id="hud-score">0</b></div>
        <div class="coin-pill" title="答對賺取金幣解鎖神兵球棒！">💰 <b id="hud-coins">0</b></div>
        <div class="combo-pill" id="hud-combo">COMBO x0</div>
        <div class="outs-pill">
          OUT
          <span class="out-dot" id="out-1"></span>
          <span class="out-dot" id="out-2"></span>
        </div>
        <!-- 實況野球鑽石壘包燈號 -->
        <div class="diamond-Status" title="壘上跑者狀態">
          <div class="base-icon base-2" id="ui-base-2"></div>
          <div class="base-icon base-3" id="ui-base-3"></div>
          <div class="base-icon base-1" id="ui-base-1"></div>
          <div class="base-icon base-home"></div>
        </div>
      </div>

      <!-- 右側：神兵球棒店、科目切換、錯題特訓、語音與音效 -->
      <div class="hud-controls">
        <button class="hud-btn btn-shop" id="btn-open-shop">🏏 球棒商店</button>
        <select id="select-mode" class="hud-select">
          <option value="all">⚾ 綜合大滿貫 (100題)</option>
          <option value="chinese">📖 康軒國語 (50題)</option>
          <option value="math">🔢 翰林數學 (50題)</option>
          <option value="wrong" hidden>🎯 錯題特訓營</option>
        </select>
        <button class="hud-btn btn-wrong hidden" id="btn-wrong-mode">🎯 錯題 (0)</button>
        <button class="hud-btn" id="btn-speak" title="朗讀題目">📢 念題</button>
        <button class="hud-btn" id="btn-mute" title="音效開關">🔊</button>
      </div>
    </div>

    <!-- 題目主幹區 -->
    <div class="question-box">
      <div id="hud-subject">【國語】載入中...</div>
      <div id="hud-question">載入題目中...</div>
      <div id="hud-phonetic"></div>
    </div>
  </div>

  <!-- 底部打擊控制區：戰術技能卡 + 動態甜蜜點力量槽 + 左中右揮棒大按鍵 -->
  <div id="batting-controls">
    <!-- 戰術道具與必殺技支援列 -->
    <div class="tactical-bar">
      <button class="skill-btn" id="btn-skill-5050" title="消耗 20 金幣，刪去一個錯誤球路！">
        🕵️ 球探透視卡 <span class="skill-cost">(💰20 刪去一錯)</span>
      </button>
      <button class="skill-btn skill-fever" id="btn-skill-fever" title="消耗 40 金幣，本棒覺醒黃金氣場 100% 必出全壘打！">
        🔥 巨砲必殺覺醒 <span class="skill-cost">(💰40 必轟全壘打)</span>
      </button>
      <div class="equipped-bat-tag" id="hud-bat-name">裝備：🪵 新手木棒</div>
    </div>

    <!-- 擊球力量與甜蜜點瞄準條 -->
    <div class="power-bar-wrapper">
      <div class="power-bar-label">⚡ 擊球甜蜜點時機 (瞄準中央紅心揮棒轟出全壘打！)</div>
      <div class="power-bar-track">
        <div class="zone-single">安打區</div>
        <div class="zone-double">二壘打</div>
        <div class="zone-homerun">🔥全壘打甜蜜點🔥</div>
        <div class="zone-double">二壘打</div>
        <div class="zone-single">安打區</div>
        <div id="power-cursor"></div>
      </div>
    </div>

    <!-- 左、中、右外野揮棒按鈕 -->
    <div id="options-container"></div>
  </div>

  <!-- 🏏 神兵球棒商店彈窗 -->
  <div id="shop-modal" class="modal-overlay hidden">
    <div class="modal-card shop-card">
      <h2 class="modal-title" style="color: #facc15;">🏏 傳奇神兵球棒商店</h2>
      <p style="color: #cbd5e1; font-size: 14px; margin-bottom: 12px;">
        目前擁有金幣：<b style="color: #facc15; font-size: 20px;" id="shop-coin-count">0</b> 💰（答對題目即可賺取金幣！）
      </p>
      <div class="shop-grid" id="shop-items-container"></div>
      <button class="action-btn" id="btn-close-shop" style="margin-top: 14px;">回到球場 ⚾</button>
    </div>
  </div>

  <!-- 單球結果與教練戰術提示彈窗 -->
  <div id="feedback-modal" class="modal-overlay hidden">
    <div class="modal-card">
      <h2 class="modal-title" id="feedback-title">💥 全壘打 HOME RUN！</h2>
      <div class="modal-msg" id="feedback-msg">打擊詳情</div>
      <button class="action-btn" id="btn-next">下一打席 ⚾ (空白鍵)</button>
    </div>
  </div>

  <!-- 賽後 MVP 選手卡結算彈窗 -->
  <div id="final-modal" class="modal-overlay hidden">
    <div class="modal-card">
      <h2 class="modal-title" style="color: #f59e0b;">🏆 期中考大聯盟 MVP 選手卡</h2>
      <p id="final-rank-title" style="color: #38bdf8; font-weight: bold; font-size: 18px; margin-bottom: 6px;">稱號：台灣巨砲</p>
      
      <div class="mvp-stats">
        <div class="stat-item">
          <span class="stat-label">打擊率 (AVG)</span>
          <span class="stat-val" id="final-avg">.000</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">全壘打 (HR)</span>
          <span class="stat-val" id="final-hr">0</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">總打點 (RBI)</span>
          <span class="stat-val" id="final-score">0</span>
        </div>
      </div>

      <div id="final-wrong-summary" class="modal-msg" style="text-align: center;"></div>

      <div style="display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;">
        <button class="action-btn" id="btn-restart">再打一場 🔄</button>
        <button class="action-btn btn-wrong-action hidden" id="btn-final-wrong">🎯 挑戰錯題特訓</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { GameEngine } from './js/game.js';
    window.addEventListener('DOMContentLoaded', () => {
      new GameEngine();
    });
  </script>
</body>
</html>
