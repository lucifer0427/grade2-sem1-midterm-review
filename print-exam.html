<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>國小二年級期中考：A4 紙本模擬考卷動態產生器</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "KaiTi", "BiauKai", "DFKai-SB", "Microsoft JhengHei", "PingFang TC", serif;
      background: #f1f5f9;
      color: #0f172a;
      line-height: 1.6;
      padding: 20px;
    }
    .toolbar {
      max-width: 900px;
      margin: 0 auto 20px;
      background: #0f172a;
      color: #fff;
      padding: 16px 20px;
      border-radius: 14px;
      border: 2px solid #f59e0b;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      font-family: system-ui, "Microsoft JhengHei", sans-serif;
    }
    .toolbar-group {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }
    .toolbar select, .toolbar button, .toolbar a {
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      border: 1.5px solid #38bdf8;
      background: #1e293b;
      color: #fff;
      text-decoration: none;
    }
    .toolbar button.btn-primary {
      background: #f59e0b;
      color: #0f172a;
      border-color: #fef08a;
    }
    .toolbar button.btn-toggle-ans {
      background: #0284c7;
      border-color: #7dd3fc;
    }
    .toolbar button.btn-radar {
      background: #7c3aed;
      border-color: #c4b5fd;
    }
    .radar-panel {
      max-width: 900px;
      margin: 0 auto 20px;
      background: #1e293b;
      color: #f8fafc;
      padding: 18px 22px;
      border-radius: 14px;
      border: 2px solid #a855f7;
      font-family: system-ui, "Microsoft JhengHei", sans-serif;
      box-shadow: 0 8px 24px rgba(0,0,0,0.18);
    }
    .radar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      border-bottom: 1px solid #334155;
      padding-bottom: 10px;
      margin-bottom: 12px;
    }
    .radar-title {
      font-size: 18px;
      font-weight: 900;
      color: #fef08a;
    }
    .radar-summary-badges {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      font-size: 13px;
    }
    .radar-badge {
      background: #0f172a;
      border: 1px solid #38bdf8;
      padding: 3px 10px;
      border-radius: 999px;
      color: #e0f2fe;
      font-weight: 700;
    }
    .radar-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 10px;
      margin-bottom: 12px;
    }
    .radar-bar-card {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 10px 12px;
    }
    .radar-bar-top {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      font-weight: 800;
      margin-bottom: 5px;
    }
    .radar-track {
      height: 10px;
      background: #1e293b;
      border-radius: 99px;
      overflow: hidden;
    }
    .radar-fill {
      height: 100%;
      background: linear-gradient(90deg, #f97316, #ef4444);
      border-radius: 99px;
    }
    .radar-advice {
      background: rgba(250, 204, 21, 0.12);
      border-left: 4px solid #facc15;
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 13.5px;
      color: #fef08a;
      line-height: 1.5;
    }
    .exam-sheet {
      max-width: 900px;
      margin: 0 auto;
      background: #ffffff;
      padding: 36px 42px;
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.12);
    }
    .exam-header {
      border-bottom: 3px double #0f172a;
      padding-bottom: 14px;
      margin-bottom: 20px;
      text-align: center;
    }
    .exam-title {
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 2px;
      margin-bottom: 10px;
    }
    .student-info {
      display: flex;
      justify-content: space-between;
      font-size: 16px;
      font-weight: bold;
      flex-wrap: wrap;
      gap: 10px;
    }
    .score-box {
      border: 2px solid #0f172a;
      padding: 2px 18px;
      border-radius: 4px;
    }
    .question-item {
      padding: 12px 6px;
      border-bottom: 1px dashed #cbd5e1;
      page-break-inside: avoid;
    }
    .q-stem {
      font-size: 19px;
      font-weight: bold;
      margin-bottom: 6px;
    }
    .q-unit-tag {
      font-size: 13px;
      color: #475569;
      background: #e2e8f0;
      padding: 2px 8px;
      border-radius: 6px;
      margin-right: 6px;
      font-family: "Microsoft JhengHei", sans-serif;
    }
    .q-phonetic {
      font-size: 14px;
      color: #64748b;
      margin-left: 34px;
      margin-bottom: 6px;
    }
    .q-options {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-left: 34px;
      font-size: 17px;
    }
    .q-ans-box {
      margin-top: 8px;
      margin-left: 34px;
      padding: 8px 12px;
      background: #fef9c3;
      border-left: 4px solid #eab308;
      font-size: 14px;
      color: #713f12;
      font-family: "Microsoft JhengHei", sans-serif;
    }
    .hidden { display: none !important; }
    .highlight-box {
      border: 1.5px solid #0f172a;
      padding: 0 5px;
      border-radius: 4px;
      background: #f8fafc;
    }
    @media print {
      body { background: #fff; padding: 0; }
      .toolbar, .radar-panel { display: none !important; }
      .exam-sheet { box-shadow: none; padding: 10px 15px; max-width: 100%; }
    }
  </style>
  <link rel="manifest" href="./manifest.json">
</head>
<body>
  <div class="toolbar">
    <div class="toolbar-group">
      <a href="./index.html">⚾ 回棒球版</a>
      <a href="./minecraft.html" style="border-color:#4ade80;color:#86efac;">⛏️ 回麥塊版</a>
      <select id="sel-subject">
        <option value="all">⚾ 國數生三科綜合模擬卷 (150題庫)</option>
        <option value="chinese">📖 康軒國語期中卷 (第1~6課 50題)</option>
        <option value="math">🔢 翰林數學期中卷 (第1~5單元 50題)</option>
        <option value="life">🌱 生活課程期中卷 (第1~4單元 50題)</option>
        <option value="chi_poly">🔤 國語專項：多音字辨析</option>
        <option value="chi_typo">🔍 國語專項：形近字與改錯</option>
        <option value="chi_radical">🧩 國語專項：部首與部件</option>
        <option value="chi_reading">📚 國語專項：課文文意理解</option>
        <option value="chi_grammar">✍️ 國語專項：短語量詞與句型</option>
        <option value="math_u1">💯 數學專項：200以內的數</option>
        <option value="math_u2">➕ 數學專項：二位數加減法</option>
        <option value="math_u3">📏 數學專項：公分與斷尺</option>
        <option value="math_u4">🏃 數學專項：兩步驟應用</option>
        <option value="math_u5">📐 數學專項：平面圖形與直線</option>
        <option value="life_u1">🍂 生活專項：秋天的觀察</option>
        <option value="life_u2">☀️ 生活專項：光與影子</option>
        <option value="life_u3">🏪 生活專項：認識社區生活</option>
        <option value="life_u4">🏫 生活專項：校園安全與自理</option>
        <option value="wrong_all">🎯 雙版本綜合錯題訂正卷 (棒球+麥塊)</option>
        <option value="wrong_baseball">🎯 棒球版錯題訂正卷</option>
        <option value="wrong_mc">🎯 麥塊版錯題訂正卷</option>
      </select>
      <select id="sel-count">
        <option value="10">10 題 (隨堂小考 10分/題)</option>
        <option value="20" selected>20 題 (標準測驗 5分/題)</option>
        <option value="25">25 題 (完整評量 4分/題)</option>
        <option value="50">50 題 (全題庫總複習 2分/題)</option>
      </select>
      <button type="button" id="btn-regenerate">🔄 重新抽題組卷</button>
    </div>
    <div class="toolbar-group">
      <button type="button" class="btn-radar" id="btn-toggle-radar">📊 弱點單元雷達分析</button>
      <button type="button" class="btn-toggle-ans" id="btn-toggle-ans">👁️ 顯示教師解答與解析</button>
      <button type="button" class="btn-primary" id="btn-print">🖨️ 列印 A4 考卷 / 存成 PDF</button>
    </div>
  </div>

  <!-- 📊 學童弱點單元雷達分析面板 (讀取棒球版與麥塊版雙存檔) -->
  <div id="weakness-radar-panel" class="radar-panel">
    <div class="radar-header">
      <div class="radar-title">📊 學童弱點單元雷達分析儀（整合 ⚾棒球版 ＆ ⛏️麥塊版 作答紀錄）</div>
      <div class="radar-summary-badges" id="radar-badges"></div>
    </div>
    <div class="radar-grid" id="radar-bars-container"></div>
    <div class="radar-advice" id="radar-advice-box"></div>
  </div>

  <div class="exam-sheet">
    <div class="exam-header">
      <div class="exam-title" id="sheet-title">108 課綱國小二年級上學期 期中定期評量模擬試卷</div>
      <div class="student-info">
        <span>範圍：<b id="sheet-scope">康軒國語 + 翰林數學 + 生活課程</b></span>
        <span>二年 ＿＿ 班 ＿＿ 號　姓名：＿＿＿＿＿＿</span>
        <span class="score-box">得分：＿＿＿＿ 分</span>
      </div>
    </div>
    <div id="questions-list"></div>
  </div>

  <script type="module">
    import { getQuestionsByFilter, shuffleArray, QUESTION_MAP, ALL_QUESTIONS } from './js/curriculum.js';

    let showAnswers = false;
    let currentPaper = [];

    function escapeHTML(str) {
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function formatStem(str) {
      return escapeHTML(str).replace(/\[([^\]]+)\]/g, '<span class="highlight-box">$1</span>');
    }

    function renderWeaknessRadar() {
      const badgesEl = document.getElementById('radar-badges');
      const barsEl = document.getElementById('radar-bars-container');
      const adviceEl = document.getElementById('radar-advice-box');
      if (!badgesEl || !barsEl || !adviceEl) return;

      let baseballWrongIds = [];
      let mcWrongIds = [];
      let baseballSeenIds = [];
      let mcSeenIds = [];

      try {
        baseballWrongIds = JSON.parse(localStorage.getItem('g2_baseball_wrong_ids') || '[]');
        mcWrongIds = JSON.parse(localStorage.getItem('g2_mc_wrong_ids') || '[]');
        baseballSeenIds = JSON.parse(localStorage.getItem('g2_baseball_seen_ids') || '[]');
        mcSeenIds = JSON.parse(localStorage.getItem('g2_mc_seen_ids') || '[]');
      } catch {
        // 忽略無痕讀取限制
      }

      const combinedSeenCount = new Set([...baseballSeenIds, ...mcSeenIds]).size;
      const combinedWrongSet = new Set([...baseballWrongIds, ...mcWrongIds]);
      const wrongQuestions = Array.from(combinedWrongSet).map(id => QUESTION_MAP.get(id)).filter(Boolean);

      badgesEl.innerHTML = `
        <span class="radar-badge">📚 總題庫探索度：${combinedSeenCount} / ${ALL_QUESTIONS.length} 題</span>
        <span class="radar-badge">⚾ 棒球版待訂正：${baseballWrongIds.length} 題</span>
        <span class="radar-badge">⛏️ 麥塊版待訂正：${mcWrongIds.length} 題</span>
        <span class="radar-badge">🎯 跨版本不重複錯題：${wrongQuestions.length} 題</span>
      `;

      // 分組統計 8 大核心觀念區段
      const buckets = [
        { key: 'chi_poly', label: '🔤 國語：多音字與字音', filterMode: 'chi_poly', count: 0, tip: '重點複習「著（ㄓㄠˊ涼／ㄓㄜ˙）、假（ㄐㄧㄚˇ／ㄐㄧㄚˋ）、轉（ㄓㄨㄢˇ／ㄓㄨㄢˋ）、背（ㄅㄟ／ㄅㄟˋ）」，搭配情境造詞記憶。' },
        { key: 'chi_typo', label: '🔍 國語：形近字與部首', filterMode: 'chi_typo', count: 0, tip: '重點比對「竹籃／藍天、柿餅／市場、准許／準備、圓圈／果園」，以及「舜（舛部）、巷（己部）」部首。' },
        { key: 'chi_gram', label: '✍️ 國語：短語與句型修辭', filterMode: 'chi_grammar', count: 0, tip: '加強「一（陣陣）秋風（量詞疊字）」與「先…再…、除了…還…、一…就…」因果與順序句型。' },
        { key: 'math_u1_u2', label: '➕ 數學：200內數與加減直式', filterMode: 'math_u2', count: 0, tip: '提醒孩子十位借 1 要退位減 1，驗算時「被減數 ＝ 差 ＋ 減數」不要把大數加錯邊。' },
        { key: 'math_u3', label: '📏 數學：公分與斷尺量測', filterMode: 'math_u3', count: 0, tip: '熟記斷尺口訣：「終點刻度 － 起點刻度 ＝ 實際長度」，或直接數中間跳了幾大格！' },
        { key: 'math_u4_u5', label: '🏃 數學：兩步驟應用與幾何', filterMode: 'math_u4', count: 0, tip: '兩步驟題先算出「中間總數或剩餘數」，再算第二步；幾何注意正方形「四邊等長＋四角直角」。' },
        { key: 'life_u2', label: '☀️ 生活：光與影子方向長短', filterMode: 'life_u2', count: 0, tip: '熟記「影子永遠在太陽相反方向」、「中午 12 點太陽最高影子最短」、「光源越近影子越大」。' },
        { key: 'life_other', label: '🌱 生活：秋天、社區與安全', filterMode: 'life', count: 0, tip: '區分「110 警察局／119 消防救護」，火災濃煙「壓低身體掩口鼻」，地震「趴下、掩護、穩住」。' }
      ];

      wrongQuestions.forEach(q => {
        const numId = parseInt(q.id.split('_')[1], 10);
        if (q.subject === '國語') {
          if (numId >= 1 && numId <= 10) buckets[0].count++;
          else if (numId >= 11 && numId <= 32) buckets[1].count++;
          else buckets[2].count++;
        } else if (q.subject === '數學') {
          if (q.unit.includes('第 1 單元') || q.unit.includes('第 2 單元')) buckets[3].count++;
          else if (q.unit.includes('第 3 單元')) buckets[4].count++;
          else buckets[5].count++;
        } else if (q.subject === '生活') {
          if (q.unit.includes('光與影子')) buckets[6].count++;
          else buckets[7].count++;
        }
      });

      const maxErr = Math.max(3, ...buckets.map(b => b.count));
      barsEl.innerHTML = buckets.map(b => {
        const pct = Math.min(100, Math.round((b.count / maxErr) * 100));
        return `
          <div class="radar-bar-card" style="cursor:pointer;" data-filter="${b.filterMode}" title="點擊立即切換為此單元專項試卷">
            <div class="radar-bar-top">
              <span>${b.label}</span>
              <span style="color:${b.count > 0 ? '#f87171' : '#4ade80'};">${b.count} 題待加強</span>
            </div>
            <div class="radar-track">
              <div class="radar-fill" style="width:${pct}%;"></div>
            </div>
          </div>
        `;
      }).join('');

      barsEl.querySelectorAll('.radar-bar-card').forEach(card => {
        card.onclick = () => {
          const targetMode = card.dataset.filter;
          const sel = document.getElementById('sel-subject');
          if (sel && targetMode) {
            sel.value = targetMode;
            buildExamPaper();
          }
        };
      });

      const sortedWeak = [...buckets].filter(b => b.count > 0).sort((a, b) => b.count - a.count);
      if (sortedWeak.length === 0) {
        adviceEl.innerHTML = `🌟 <b>太棒了！目前棒球版與麥塊版都沒有累積錯題紀錄！</b> 建議直接列印「⚾ 國數生三科綜合模擬卷」進行考前計時實戰演練。`;
      } else {
        const topWeak = sortedWeak[0];
        adviceEl.innerHTML = `
          🧭 <b>AI 診斷頭號弱點：【${topWeak.label}】（累積 ${topWeak.count} 題）</b><br>
          💡 <b>陪讀引導建議</b>：${topWeak.tip}
        `;
      }
    }

    function buildExamPaper() {
      const mode = document.getElementById('sel-subject').value;
      const count = parseInt(document.getElementById('sel-count').value, 10);
      const scopeLabel = document.getElementById('sel-subject').selectedOptions[0].textContent;
      document.getElementById('sheet-scope').textContent = scopeLabel;

      let pool = [];
      if (mode === 'wrong_baseball' || mode === 'wrong_mc' || mode === 'wrong_all') {
        try {
          const bIds = JSON.parse(localStorage.getItem('g2_baseball_wrong_ids') || '[]');
          const mIds = JSON.parse(localStorage.getItem('g2_mc_wrong_ids') || '[]');
          const targetIds = mode === 'wrong_all'
            ? Array.from(new Set([...bIds, ...mIds]))
            : (mode === 'wrong_mc' ? mIds : bIds);
          pool = targetIds.map(id => QUESTION_MAP.get(id)).filter(Boolean);
        } catch {
          pool = [];
        }
        if (pool.length === 0) {
          alert('目前所選的錯題庫沒有錯題紀錄喔！已自動為您載入三科綜合模擬題庫。');
          pool = getQuestionsByFilter('all');
        }
      } else {
        pool = getQuestionsByFilter(mode);
      }

      currentPaper = shuffleArray(pool).slice(0, Math.min(count, pool.length)).map(q => ({
        ...q,
        options: shuffleArray(q.options)
      }));

      renderPaper();
      renderWeaknessRadar();
    }

    function renderPaper() {
      const listEl = document.getElementById('questions-list');
      const ptsPerQ = Math.round(100 / Math.max(1, currentPaper.length));
      listEl.innerHTML = '';

      currentPaper.forEach((q, idx) => {
        const correctIdx = q.options.findIndex(o => o.isCorrect);
        const ansNum = correctIdx + 1;
        const correctOpt = q.options[correctIdx];
        const ansDisplay = showAnswers ? `<b style="color:#dc2626;">${ansNum}</b>` : '　';

        const item = document.createElement('div');
        item.className = 'question-item';
        item.innerHTML = `
          <div class="q-stem">
            （${ansDisplay}）${idx + 1}. <span class="q-unit-tag">${escapeHTML(q.subject)}・${escapeHTML(q.unit)}</span>
            ${formatStem(q.question)} <span style="font-size:13px;color:#64748b;">(${ptsPerQ}分)</span>
          </div>
          ${q.phonetic ? `<div class="q-phonetic">💡 提示／注音：${escapeHTML(q.phonetic)}</div>` : ''}
          <div class="q-options">
            ${q.options.map((opt, i) => `<div>(${i + 1}) ${escapeHTML(opt.text)}</div>`).join('')}
          </div>
          <div class="q-ans-box ${showAnswers ? '' : 'hidden'}">
            ✅ <b>標準答案：(${ansNum}) ${escapeHTML(correctOpt?.text || '')}</b><br>
            🧭 <b>家長／教師引導解析</b>：${escapeHTML(q.hint)}
          </div>
        `;
        listEl.appendChild(item);
      });
    }

    document.getElementById('btn-regenerate').onclick = buildExamPaper;
    document.getElementById('sel-subject').onchange = buildExamPaper;
    document.getElementById('sel-count').onchange = buildExamPaper;

    document.getElementById('btn-toggle-radar').onclick = () => {
      document.getElementById('weakness-radar-panel').classList.toggle('hidden');
    };

    document.getElementById('btn-toggle-ans').onclick = (e) => {
      showAnswers = !showAnswers;
      e.target.textContent = showAnswers ? '🙈 隱藏解答（切換學生作答卷）' : '👁️ 顯示教師解答與解析';
      renderPaper();
    };

    document.getElementById('btn-print').onclick = () => window.print();

    buildExamPaper();

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
